spring:
  application:
    name: freelancepilot
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/freelancepilot}
    username: ${DATABASE_USER:freelancepilot}
    password: ${DATABASE_PASSWORD:changeme}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

server:
  port: ${BACKEND_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui